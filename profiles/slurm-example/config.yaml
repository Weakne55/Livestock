# Portable starting point; adapt these values to the target cluster.
executor: slurm
jobs: 3
cores: 24
latency-wait: 120
rerun-incomplete: true
show-failed-logs: true
software-deployment-method:
  - apptainer
default-resources:
  mem_mb: 8000
  runtime: 120
  slurm_partition: main
# Optional, cluster-specific: uncomment only after editing.
#  slurm_account: YOUR_SLURM_ACCOUNT
# apptainer-args: --cleanenv --bind /your/shared/storage:/your/shared/storage
apptainer-args: --cleanenv
