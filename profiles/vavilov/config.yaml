executor: slurm
jobs: 3
cores: 24
resources:
  mem_mb: 64000
slurm-no-account: true
slurm-status-command: sacct
slurm-status-attempts: 10
slurm-pass-command-as-script: true
latency-wait: 120
rerun-incomplete: true
printshellcmds: false
show-failed-logs: true
software-deployment-method:
- apptainer
default-resources:
  mem_mb: 4000
  runtime: 120
  slurm_partition: main
  slurm_extra: --nodelist=vavilov1
apptainer-args: --cleanenv --bind /mnt/hot:/mnt/hot,/nfs/home:/nfs/home
